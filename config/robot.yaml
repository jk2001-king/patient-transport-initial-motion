  timestep_s: 0.0083333333     # calibrated model: 120 Hz
  substeps: null
  solver_type: null
  use_gpu_dynamics: null
  base_mass_kg: 220.0
  assembled_rigid_body_mass_kg: 240.3372079473
  base_com_m: [0.0, 0.0, 0.1]
  ground_material: {steering_response_equivalent_friction: 0.0025, longitudinal_friction: null}
  active_wheel_material: {steering_response_equivalent_friction: 0.0025, longitudinal_friction: null}
  caster_material: null
  calibration_note: "mu_eq is steering-response matched and must not be treated as calibrated longitudinal tire traction"
  drive_sign_test:
    condition: {friction: 0.5, physics_hz: 120, target_joint_speed_rad_s: 1.0, duration_s: 2.0}
    command: {front_rad_s: 1.0, rear_rad_s: -1.0}
