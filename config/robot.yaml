  articulation_root: /World/patient_transport/base_link
  base_prim: /World/patient_transport/base_link

frames:
  body_reference: /World/patient_transport/base_link
  forward_axis: +X             # verified after ACKERMANN raw-zero calibration
  left_axis: +Y                # right-handed planar frame with up_axis=+Z
  up_axis: +Z

geometry_si:
  l_f_m: 0.645
  l_r_m: 0.645
  wheelbase_m: 1.29
  active_wheel_radius_m: {front: 0.075, rear: 0.075}
  caster:
    fl: {position_xy_m: [0.645, 0.3365], trail_m: 0.095, wheel_radius_m: 0.05}
    fr: {position_xy_m: [0.645, -0.3365], trail_m: 0.095, wheel_radius_m: 0.05}
    rl: {position_xy_m: [-0.645, 0.3365], trail_m: 0.095, wheel_radius_m: 0.05}
    rr: {position_xy_m: [-0.645, -0.3365], trail_m: 0.095, wheel_radius_m: 0.05}

joints:
  steering:
    front:
      prim_path: /World/patient_transport/joints/front_steering_joint
      axis: Z
      raw_straight_rad: 1.5707963268 # raw +90 deg = physical straight
      physical_sign: 1
      raw_limits_rad: [0.7853981634, 2.3561944902] # persistent ACKERMANN workspace limits: raw 45..135 deg
      physical_limits_rad: [-0.7853981634, 0.7853981634] # ACKERMANN operational limits: ±45 deg
      mode_transition_physical_limits_rad: [-1.5707963268, 1.5707963268] # DIFF mode can reach ±90 deg
      max_rate_rad_s: 0.2396844987 # 13.732910 deg/s, real Profile Position setting
      usd_drive: {type: acceleration, stiffness: 10000.0, damping: 1000.0, max_force: 1500.0}
    rear:
      prim_path: /World/patient_transport/joints/rear_steering_joint
      axis: Z
      raw_straight_rad: 1.5707963268 # raw +90 deg = physical straight
      physical_sign: 1
      raw_limits_rad: [0.7853981634, 2.3561944902] # persistent ACKERMANN workspace limits: raw 45..135 deg
      physical_limits_rad: [-0.7853981634, 0.7853981634] # ACKERMANN operational limits: ±45 deg
      mode_transition_physical_limits_rad: [-1.5707963268, 1.5707963268] # DIFF mode can reach ±90 deg
      max_rate_rad_s: 0.2396844987 # 13.732910 deg/s, real Profile Position setting
      usd_drive: {type: acceleration, stiffness: 10000.0, damping: 1000.0, max_force: 1500.0}
  drive:
    front:
      prim_path: /World/patient_transport/joints/front_wheel_joint
      axis: X
      velocity_sign: 1         # positive robot-forward speed -> positive joint velocity
      usd_drive: {type: force, stiffness: 0.0, damping: 1.0, max_force: null}
    rear:
      prim_path: /World/patient_transport/joints/rear_wheel_joint
      axis: X
      velocity_sign: -1        # positive robot-forward speed -> negative joint velocity
      usd_drive: {type: force, stiffness: 0.0, damping: 1.0, max_force: null}
  caster:
    fl: {swivel_prim_path: /World/patient_transport/joints/caster_fl_swivel_joint, spin_prim_path: /World/patient_transport/joints/caster_fl_wheel_joint, swivel_zero_rad: null, swivel_sign: null}
    fr: {swivel_prim_path: /World/patient_transport/joints/caster_fr_swivel_joint, spin_prim_path: /World/patient_transport/joints/caster_fr_wheel_joint, swivel_zero_rad: null, swivel_sign: null}
    rl: {swivel_prim_path: /World/patient_transport/joints/caster_rl_swivel_joint, spin_prim_path: /World/patient_transport/joints/caster_rl_wheel_joint, swivel_zero_rad: null, swivel_sign: null}
    rr: {swivel_prim_path: /World/patient_transport/joints/caster_rr_swivel_joint, spin_prim_path: /World/patient_transport/joints/caster_rr_wheel_joint, swivel_zero_rad: null, swivel_sign: null}

