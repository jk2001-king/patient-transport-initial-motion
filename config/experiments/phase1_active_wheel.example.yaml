schema_version: 1
experiment:
  name: phase1_active_wheel_screening
  robot_config: config/robot.yaml
  seed: 1001
  repeats: 5
  physics:
    timestep_s: null           # must match audited robot config
    settling_duration_s: 2.0
  initial_body_si:
    x_m: 0.0
    y_m: 0.0
    yaw_rad: 0.0
    vx_m_s: 0.0
    vy_m_s: 0.0
    wz_rad_s: 0.0
  reference:
    type: constant_curvature
    duration_s: 5.0
    speed_m_s: null            # choose before pilot data collection
    front_steering_rad: 0.2617993878
    rear_steering_rad: -0.2617993878
  caster_initialization:
    mode: ideal_for_reference
  cases:
    - id: ideal
      front_initial_rad: 0.2617993878
      rear_initial_rad: -0.2617993878
      start_policy: simultaneous
    - id: front_error
      front_initial_rad: 0.0
      rear_initial_rad: -0.2617993878
      start_policy: simultaneous
    - id: rear_error
      front_initial_rad: 0.2617993878
      rear_initial_rad: 0.0
      start_policy: simultaneous
    - id: both_error
      front_initial_rad: 0.0
      rear_initial_rad: 0.0
      start_policy: simultaneous
    - id: asymmetric
      front_initial_rad: 0.0872664626
      rear_initial_rad: -0.3490658504
      start_policy: simultaneous
  logging:
    sample_period_s: null       # normally equal to physics timestep or integer multiple
    output_root: results
